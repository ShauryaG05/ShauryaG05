name: Update profile graphics

on:
  schedule:
    - cron: "0 2 * * *"      # every day, 02:00 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate heatmap and stats
        run: python scripts/generate.py
        env:
          GH_USER: ShauryaG05
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile graphics"
          git push
